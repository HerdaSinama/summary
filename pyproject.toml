[tool.poetry]
name = "summary"
version = "0.1.0"
description = ""
authors = ["HerdaSinama <ya.zabil@inbox.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
psycopg = {version = ">=3.1", extras = ["binary"]}
sqlalchemy = ">=2.0"
geoalchemy2 = "^0.20.0"
shapely = "^2.1.2"
pydantic = ">=2.0"
pydantic-settings = "^2.15.0"
alembic = "^1.20.0"
typer = "^0.27.2"
pydantic-geojson = "^0.3.2"
asyncpg = "^0.31.0"
asyncio = "^4.0.0"
openai = "^3.16.2"
fastapi = "^0.141.1"
celery = "^5.6.3"
uvicorn = "^0.54.0"
websockets = "^17.1"
httpx = "^0.28.1"
boto3 = "^1.43.103"
watchdog = "^6.0.0"
ruff = "^0.16.9"


[tool.poetry.group.dev.dependencies]
boto3-stubs = {extras = ["s3"], version = "^1.43.103"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint]
ignore = [
    "B008",
    "EXE002",
]

[tool.ruff]
extend-exclude = ["alembic"]