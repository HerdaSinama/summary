services:
  db:
    image: postgis/postgis:16-3.5
    container_name: summary_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: summary_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: summary_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  worker:
    build: .
    container_name: celery-worker
    command: poetry run celery -A app.core.celery:celery worker --pool=threads --concurrency=10 --loglevel=info
    depends_on:
      - db
      - rabbitmq
    env_file:
      - .env
    environment:
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: rpc://
    volumes:
      - .:/app

  s3:
      image: minio/minio:latest
      ports:
        - "9000:9000"
        - "9001:9001"
      environment:
        - MINIO_ROOT_USER=minioadmin
        - MINIO_ROOT_PASSWORD=minioadmin
      volumes:
        - minio_data:/data
      command: server /data --console-address ":9001"

  createbuckets:
    image: minio/minio:latest
    depends_on:
      - s3
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set myminio http://s3:9000 minioadmin minioadmin; do
        echo 'Waiting for MinIO...'
        sleep 1
      done;
      /usr/bin/mc mb --ignore-existing myminio/dev-bucket;
      exit 0;
      "

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
